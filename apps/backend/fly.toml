# Fly.io configuration for Zenthorax Backend
# Docs: https://fly.io/docs/reference/configuration/

app = "zenthorax-api"
primary_region = "bom"

[build]
  dockerfile = "../../docker/Dockerfile.backend"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # CRITICAL: always running, no cold starts
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"

# Secrets to set via `flyctl secrets set`:
# DATABASE_URL
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_ANON_KEY
# SUPABASE_JWT_SECRET
# REDIS_URL
# SENTRY_DSN
